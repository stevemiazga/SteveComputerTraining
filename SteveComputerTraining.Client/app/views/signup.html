<div class="row">
    <div class="col-md-2">
        &nbsp;
    </div>
    <div class="col-md-8">
        <h4>Sign Up</h4>
    </div>
    <div class="col-md-2">
        &nbsp;
    </div>
</div>
<div class="row">
    <form name="signUpForm" role="form">
        <div class="col-md-2">
            &nbsp;
        </div>
        <div class="col-md-8">
            <div class="form-group">
                <label for="username">User Name:</label>
                <input type="text" class="form-control" placeholder="Username" name="userName" data-ng-model="registration.userName" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" placeholder="Password" name="password" data-ng-model="registration.password" required>
            </div>
            <div class="form-group">
                <label for="password">Confirm Password:</label>
                <input type="password" class="form-control" placeholder="Confirm Password" name="confirmPassword" data-ng-model="registration.confirmPassword" required>
            </div>
            <div class="form-group">
                <button class="btn btn-lg btn-primary btn-block" type="submit" data-ng-click="signUp()">Submit</button>
            </div>
            <div class="form-group">
                <div data-ng-hide="message == ''" data-ng-class="(savedSuccessfully) ? 'alert alert-success' : 'alert alert-danger'">
                    {{message}}
                </div>
            </div>
        </div>
        <div class="col-md-2">
            &nbsp;
        </div>
    </form>
</div>
