<div class="row">
    <div class="col-md-2">
        &nbsp;
    </div>
    <div class="col-md-8">
        <h4>Login</h4>
    </div>
    <div class="col-md-2">
        &nbsp;
    </div>
</div>
<div class="row">
    <form name="loginForm" role="form">
        <div class="col-md-2">
            &nbsp;
        </div>
        <div class="col-md-8">
            <div class="form-group">
                <label for="username">User Name:</label>
                <input type="text" id="username" class="form-control" placeholder="Enter Username" name="userName" data-ng-model="loginData.userName" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" class="form-control" placeholder="Enter Password" name="password" data-ng-model="loginData.password" required>
            </div>
            <div class="form-group">
                <button class="btn btn-lg btn-primary btn-block" type="submit" data-ng-click="login()">Login</button>
            </div>
            <div class="form-group">
                <div data-ng-hide="message == ''" class="alert alert-danger">
                    {{message}}
                </div>
            </div>
        </div>
        <div class="col-md-2">
            &nbsp;
        </div>
    </form>
</div>
