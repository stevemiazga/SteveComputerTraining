<div class="row">
    <div class="col-md-2">
        &nbsp;
    </div>
    <div class="col-md-8">
        <h4>See Course Schedule</h4>
        <p><a class="btn btn-primary" href="#/schedules" role="button">Schedule &raquo;</a></p>
    </div>
    <div class="col-md-2">
        &nbsp;
    </div>
</div>
<div class="row">
    <div class="col-md-2">
        &nbsp;
    </div>
    <div class="col-md-8">
        <div ng-if="viewLoading">
            Loading...
        </div>
        <div data-ng-repeat="category in categories">
            <!--<div class="table-responsive">-->
            <div>
                <table class="table table-striped table-bordered table-hover">
                    <thead>
                        <tr>
                            <th colspan="2">
                                <span>Category: {{category.category}}</span>
                            </th>
                        </tr>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-ng-repeat="course in courses | filter:category.category">
                            <td>
                                {{ course.title }}
                            </td>
                            <td>
                                {{ course.description }}
                            </td>
                        </tr>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-2">
        &nbsp;
    </div>
</div>
